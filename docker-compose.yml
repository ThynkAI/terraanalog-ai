# docker compose up --build   →   UI http://localhost:3000 , API http://localhost:8000/docs
services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      # Point at Bot 1's research outputs by mounting them and changing this path, e.g. /app/data/real
      TERRA_DATA_DIR: ${TERRA_DATA_DIR:-/app/data/fixtures}
      TERRA_CORS_ORIGINS: ${TERRA_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data/real:/app/data/real:ro
    ports: ["${API_PORT:-8000}:8000"]
  web:
    build: { context: ./web }
    environment:
      API_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
