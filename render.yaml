# Render Blueprint for TerraAnalog AI (https://render.com/docs/blueprint-spec).
# One click: Render Dashboard → New → Blueprint → pick this repository. Creates two free web services:
#   terraanalog-api  FastAPI scoring/data service (app/backend), serving the research dataset in app/data/research
#   terraanalog-web  Next.js UI (app/web); its server-side /api/* proxy is wired to the API service below.
# No secrets are needed.
services:
  - type: web
    name: terraanalog-api
    runtime: python
    plan: free
    rootDir: app
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TERRA_DATA_DIR
        value: data/research          # synthetic fallback: data/fixtures
      - key: TERRA_CORS_ORIGINS
        value: "*"                    # the UI calls the API server-side; browsers never need direct access

  - type: web
    name: terraanalog-web
    runtime: node
    plan: free
    rootDir: app/web
    buildCommand: npm ci && npm run build
    startCommand: npm start           # next start honours $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Cap the V8 heap (applies to the build and to `next start`). Free instances have 512 MB RAM at runtime;
      # Render builds run separately on the build pipeline (Starter tier: 8 GB RAM). Verified locally 2026-11-15
      # (app/docs/TEST_RESULTS.md): `next build` succeeds with this cap, and `next start` with this cap in a
      # 512 MB container peaked at 105 MB while serving every page, the API proxy and the PDF export.
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      # API wiring: the API's public hostname (free web services cannot receive private-network traffic).
      # The proxy turns it into https://<host>. On paid plans you can switch to the private network with
      #   fromService: { name: terraanalog-api, type: web, property: hostport }
      - key: API_HOST
        fromService:
          name: terraanalog-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
